<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LUCKY DEV – Bots & Channels</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Manrope:wght@400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{--ac:#38bdf8;--ac2:#a78bfa;--gold:#f5c26b;--bg:#060910;--cd:#0d1424;--bd:#213256;--tx:#eef3ff;--mu:#8b97b5}
*{box-sizing:border-box;margin:0}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;top:0;left:0;right:0;bottom:0;z-index:-2;
 background:
  radial-gradient(560px 360px at 88% -6%,#a78bfa40,transparent),
  radial-gradient(560px 380px at -4% 26%,#38bdf840,transparent),
  radial-gradient(420px 300px at 60% 92%,#f5c26b1c,transparent),
  radial-gradient(#ffffff14 1px,transparent 1px),
  linear-gradient(180deg,#060910,#080d18 40%,#060910);
 background-size:auto,auto,auto,22px 22px,auto}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(140% 90% at 50% 0%,transparent 55%,#060910d0 100%)}
nav{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:#060910b8;backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid #ffffff14;box-shadow:0 1px 0 #38bdf81a}
.lg{font:700 17px 'Space Grotesk';text-decoration:none;letter-spacing:.3px;color:var(--tx)}
.lg span{background:linear-gradient(90deg,var(--ac),var(--ac2),var(--ac));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:200% center}}
.jn{background:linear-gradient(180deg,#fff,#dfe6f5);color:#04101c;font:700 12px 'Space Grotesk';padding:9px 16px;border-radius:99px;text-decoration:none;box-shadow:0 4px 14px #0009,inset 0 1px 0 #fff}
.wrap{max-width:560px;margin:auto;padding:34px 18px 90px}
.hero{text-align:center;padding:10px 0 24px;animation:rise .7s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.ava{width:120px;height:120px;margin:0 auto 16px;position:relative}
.ava::before{content:"";position:absolute;inset:-18px;border-radius:50%;background:radial-gradient(circle,#38bdf84a,transparent 65%);filter:blur(4px);animation:pulse 3.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.04)}}
.ring{width:100%;height:100%;border-radius:50%;background:conic-gradient(from 0deg,var(--ac),var(--ac2),var(--gold),var(--ac));padding:4px;box-sizing:border-box;overflow:hidden;box-shadow:0 10px 30px #000a}
.ph{width:100%;height:100%;border-radius:50%;overflow:hidden;background:#101a33;border:3px solid var(--bg);box-sizing:border-box;display:grid;place-items:center}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{font:700 34px 'Space Grotesk';color:var(--tx)}
.tick{position:absolute;right:0;bottom:2px;width:32px;height:32px;display:block;border-radius:50%;animation:glow 2s ease-in-out infinite}
.tick svg{width:100%;height:100%;display:block}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 4px #1d9bf0cc) drop-shadow(0 0 10px #1d9bf066) drop-shadow(0 2px 4px #000c)}50%{filter:drop-shadow(0 0 8px #1d9bf0) drop-shadow(0 0 18px #38bdf8aa) drop-shadow(0 2px 4px #000c)}}
h1{font:700 28px 'Space Grotesk';display:flex;gap:8px;justify-content:center;align-items:center;letter-spacing:.2px;text-shadow:0 0 24px #38bdf83a;margin-top:6px}
.star{width:.6em;height:.6em}
.bio{color:var(--mu);margin-top:8px;font-size:14.5px;max-width:420px;margin-inline:auto}
.badge{display:inline-flex;align-items:center;gap:5px;font:700 10.5px 'Space Grotesk';letter-spacing:.7px;color:#1a1305;background:linear-gradient(90deg,var(--gold),#ffe1a3);padding:5px 12px 5px 10px;border-radius:99px;margin-bottom:10px;box-shadow:0 4px 14px #f5c26b33}
.pill{display:inline-block;font:400 11px 'JetBrains Mono',monospace;color:var(--ac);border:1px solid #38bdf880;background:#38bdf81a;padding:5px 12px;border-radius:8px;margin-bottom:10px;letter-spacing:.4px;backdrop-filter:blur(6px)}
.tb{display:flex;gap:8px;justify-content:center;margin:18px 0}
.tb button{background:#ffffff08;color:var(--mu);border:1px solid #ffffff20;border-radius:99px;padding:9px 18px;font:600 13px Manrope;cursor:pointer;backdrop-filter:blur(6px);transition:all .2s}
.tb button.on{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#04101c;border-color:transparent;box-shadow:0 6px 18px #38bdf84a}
.sr{width:100%;background:#ffffff08;color:var(--tx);border:1px solid #ffffff20;border-radius:12px;padding:12px 16px;font:14px Manrope;margin-bottom:16px;backdrop-filter:blur(6px)}
#items{display:grid;gap:12px}
.it{display:flex;gap:14px;align-items:center;background:linear-gradient(#101c38,#0d1424);border:1px solid #ffffff14;border-radius:16px;padding:16px;box-shadow:0 10px 26px -16px #000d,inset 0 1px 0 #ffffff10;transition:transform .18s}
.it:active{transform:scale(.98)}
.em{width:52px;height:52px;flex:none;border-radius:15px;background:#152244;display:grid;place-items:center;font-size:26px;box-shadow:inset 0 0 0 1px #ffffff14}
.it div.ci{flex:1;min-width:0}
.it b{display:block;font-size:16px;font-family:'Space Grotesk'}
.it small{color:var(--ac);font:12px 'JetBrains Mono',monospace}
.it p{color:var(--mu);font-size:13.5px;margin-top:3px}
.it a{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#04101c;font:700 13px 'Space Grotesk';padding:9px 16px;border-radius:10px;text-decoration:none;flex:none;box-shadow:0 8px 20px #38bdf83a}
.mu{text-align:center;color:var(--mu);padding:40px 0}
.fab{position:fixed;right:16px;bottom:16px;width:54px;height:54px;border-radius:17px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-size:24px;text-decoration:none;box-shadow:0 10px 28px #000b,0 0 0 4px #38bdf822;z-index:90}
footer{text-align:center;color:var(--mu);font:12px 'JetBrains Mono',monospace;padding:16px 18px 4px}
#boot{position:fixed;inset:0;z-index:999;background:#04070d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
#boot.hide{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .5s ease,visibility .5s}
.term{position:relative;width:min(86vw,380px);font:13px/1.7 'JetBrains Mono',monospace;color:#7ee0ff;text-shadow:0 0 8px #38bdf880;min-height:150px}
.bootbar{position:relative;width:min(86vw,380px);height:3px;border-radius:3px;background:#ffffff14;overflow:hidden}
.bootbar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--ac),var(--ac2),var(--gold));box-shadow:0 0 10px #38bdf8a0;transition:width .25s linear}
.bootlogo{font:700 15px 'Space Grotesk';letter-spacing:2px;color:var(--tx);opacity:.85}
.bootlogo span{color:var(--ac)}
</style></head><body>
<div id="boot"><div class="bootlogo">LUCKY<span>.DEV</span></div><div class="term" id="bootTxt"></div><div class="bootbar"><i id="bootBarI"></i></div><div style="font:11px 'JetBrains Mono',monospace;color:#8b97b5;margin-top:6px">tap to skip</div></div>
<nav><a class="lg" href="index.html" id="lg"></a><a class="jn" id="jn" target="_blank" rel="noopener">JOIN CHANNEL</a></nav>
<div class="wrap">
 <div class="hero">
  <div class="ava"><div class="ring"><div class="ph" id="ph"></div></div><span class="tick">
   <svg viewBox="0 0 24 24"><path fill="#1d9bf0" d="M12 1l2.6 2 3.2-.3 1.2 3 2.9 1.5-.6 3.2L23 12l-1.7 2.6.6 3.2-2.9 1.5-1.2 3-3.2-.3L12 23l-2.6-2-3.2.3-1.2-3-2.9-1.5.6-3.2L1 12l1.7-2.6-.6-3.2 2.9-1.5 1.2-3 3.2.3z"/><path d="M8 12.3l2.7 2.7 5.6-5.6" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </span></div>
  <div class="badge">⚡ TOP RATED DEVELOPER</div><br>
  <div class="pill">TELEGRAM BOT &amp; AUTOMATION DEVELOPER</div>
  <h1 id="nm"></h1>
  <p class="bio">Custom Telegram bots aur automation API bots banata hu. Fast, clean aur reliable. 🚀</p>
 </div>
 <input class="sr" id="sr" placeholder="🔍 Search bot ya channel..." oninput="render()">
 <div class="tb" id="tb"></div>
 <div id="items"></div>
 <footer>© 2026 LUCKY DEV</footer>
</div>
<a class="fab" id="fab" target="_blank" rel="noopener" aria-label="Contact">💬</a>

<script>
const $=i=>document.getElementById(i);
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const U=u=>/^(https?:\/\/|tg:)/.test(u||'')?u:'https://t.me/luckyxdevv';
const D=window.SITE_CONFIG||{
  name:'LUCKY DEV',
  dp:'https://i.ibb.co/VcwHnGss/uploaded-image.jpg',
  joinLink:'https://t.me/+p-DJj4WLiJ9mZjVl',
  supportLink:'https://t.me/luckyxdevv',
  items:[
    {id:'1',type:'bot',emoji:'🤖',name:'My Bots',user:'+uKkBzMqhoWlhYzQ1',desc:'24/7 Fast Telegram Automation Bots & Tools'},
    {id:'2',type:'channel',emoji:'📢',name:'Lucky Official Channel',user:'+p-DJj4WLiJ9mZjVl',desc:'Official Telegram channel for bots & updates'}
  ]
};
let tab='all';

function render(){
 $('lg').innerHTML=E(D.name.split(' ')[0]||'LUCKY')+'<span>'+(D.name.split(' ').slice(1).join(' ')?' . '+E(D.name.split(' ').slice(1).join(' ')):'')+'</span>';
 $('jn').href=U(D.joinLink);$('fab').href=U(D.supportLink);
 $('ph').innerHTML=D.dp?`<img src="${E(D.dp)}" alt="${E(D.name)}">`:`<span>${E(D.name.slice(0,2).toUpperCase())}</span>`;
 $('nm').innerHTML=E(D.name)+' <svg class="star" viewBox="0 0 24 24"><defs><linearGradient id="pg"><stop offset="0" stop-color="#6c8cff"/><stop offset="1" stop-color="#d05cff"/></linearGradient></defs><path fill="url(#pg)" d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 20.9l1.6-7L2 9.2l7.1-.6z"/></svg>';
 document.title=D.name+' – Bots & Channels';
 $('tb').innerHTML=[['all','Sab'],['bot','🤖 Bots'],['channel','📢 Channels']].map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('');
 const q=($('sr').value||'').toLowerCase();
 let L=(D.items||[]).filter(x=>tab=='all'||x.type==tab);
 if(q)L=L.filter(x=>(x.name+' '+x.user+' '+(x.desc||'')).toLowerCase().includes(q));
 $('items').innerHTML=L.length?L.map(x=>`<div class="it"><div class="em">${E(x.emoji||(x.type=='bot'?'🤖':'📢'))}</div><div class="ci"><b>${E(x.name)}</b><small>${x.type=='bot'?'BOTS':'CHANNEL'} · @${E(x.user.replace(/^\+/,''))}</small><p>${E(x.desc||'')}</p></div><a target="_blank" rel="noopener" href="https://t.me/${E(x.user)}">Open</a></div>`).join(''):'<p class="mu">Kuch nahi mila.</p>';
}
render();

(function boot(){
 const el=document.getElementById('boot'),tx=document.getElementById('bootTxt'),bar=document.getElementById('bootBarI');
 if(matchMedia('(prefers-reduced-motion: reduce)').matches){el.remove();return}
 document.body.style.overflow='hidden';
 function finish(){if(!el.parentNode)return;el.classList.add('hide');document.body.style.overflow='';setTimeout(()=>el.remove(),400)}
 const lines=['> booting lucky_dev.sys','> scanning bots &amp; channels... <b>OK</b>','> indexing directory... <b>OK</b>','> loading premium UI... <b>OK</b>','> welcome ⚡'];
 let li=0,ci=0,out='';
 function type(){
  if(li>=lines.length){bar.style.width='100%';setTimeout(finish,350);return}
  const line=lines[li];
  if(ci<=line.length){out=lines.slice(0,li).join('\n')+(li>0?'\n':'')+line.slice(0,ci);
   tx.innerHTML=out+'<span class="cursor"></span>';
   bar.style.width=Math.round(((li+ci/line.length)/lines.length)*100)+'%';
   ci++;setTimeout(type,14+Math.random()*22);
  }else{li++;ci=0;setTimeout(type,180)}
 }
 el.addEventListener('click',finish);
 type();
})();
</script></body></html>
